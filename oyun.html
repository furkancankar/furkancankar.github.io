<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape to IBO - Balanced</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background-color: #050505; user-select: none; -webkit-user-select: none; }
        
        /* UI ELEMENTLERİ */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: none; }
        
        .screen { 
            background: rgba(10, 15, 20, 0.96); 
            color: #ddd; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            pointer-events: auto; 
            border: 1px solid #444; 
            max-width: 600px; 
            width: 90%; 
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center;
            max-height: 90vh; overflow-y: auto;
        }

        h1 { font-size: 2.5em; margin: 10px 0; color: #c00; text-shadow: 0 0 10px #500; letter-spacing: 3px; }
        
        button { 
            background: #1a1a1a; color: #fff; border: 1px solid #555; padding: 15px 40px; 
            font-size: 1.1em; cursor: pointer; font-family: inherit; font-weight: bold; 
            margin-top: 15px; transition: 0.2s; width: 100%; max-width: 280px; text-transform: uppercase; border-radius: 4px;
        }
        button:hover { background: #b00; border-color: #f00; box-shadow: 0 0 20px #900; }
        
        /* Link Butonu */
        .link-btn { background: #003366; border-color: #0055aa; margin-bottom: 10px; }
        .link-btn:hover { background: #0055aa; box-shadow: 0 0 15px #0055aa; }

        .hidden { display: none !important; }

        #story-image {
            width: 100%; height: auto; max-height: 35vh; object-fit: cover;
            border: 1px solid #333; margin-bottom: 15px; border-radius: 4px; background: #000;
        }

        /* SKOR (SÜRE) */
        #score-display { 
            position: absolute; top: 20px; left: 20px; 
            color: #fff; font-size: 1.5em; font-weight: bold; 
            z-index: 90; text-shadow: 2px 2px 4px black; 
            display: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }

        /* MOBİL KONTROLLER */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 50; }
        #joystick-area { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.05); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255, 255, 255, 0.1); }
        #stick { width: 50px; height: 50px; background: rgba(200, 50, 50, 0.6); border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 0 10px #f00; }
        #jump-btn { position: absolute; bottom: 50px; right: 30px; width: 90px; height: 90px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 1em; }
        #jump-btn:active { background: rgba(200, 50, 50, 0.5); }
        #look-area { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        #portrait-warning { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #f44; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        @media screen and (orientation: landscape) { #portrait-warning { display: none; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="MUZIK_LINKINI_BURAYA_YAPISTIR.mp3" type="audio/mpeg">
    </audio>

    <div id="portrait-warning"><h1>LUTFEN TELEFONU CEVIRIN</h1><p>Yatay modda oynamalisiniz.</p></div>
    <div id="score-display">SÜRE: 0 sn</div>
    
    <div id="ui-layer">
        <div id="main-menu" class="screen">
            <h1>ESCAPE TO IBO</h1>
            <button id="play-btn">OYNA</button>
            <button class="link-btn" onclick="window.location.href='https://www.google.com'">WEBSİTESİNE GİT</button>
        </div>

        <div id="story-screen" class="screen hidden">
            <img id="story-image" src="FOTOGRAF_LINKINI_BURAYA_YAPISTIR.jpg" alt="Hikaye Gorseli">
            <p style="margin: 5px 0; font-size: 0.9em; color:#aaa;">O seni görüyor. Sadece koş.</p>
            <button id="continue-btn">BAŞLA</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #f00;">YAKALANDIN</h1>
            <h3 id="final-score" style="color:white;"></h3>
            <button id="retry-btn">TEKRAR DENE</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-area"><div id="stick"></div></div>
        <div id="look-area"></div>
        <div id="jump-btn">ZIPLA</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls, monster, monsterBody;
        let limbJoints = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now(), isGame = false;
        let touchM = { x: 0, y: 0 }, isMob = /Android|iPhone|iPad/i.test(navigator.userAgent);
        
        // --- YENİ SKOR SİSTEMİ ---
        let gameTime = 0; // Saniye cinsinden süre
        let speedMultiplier = 1.0;
        const scoreEl = document.getElementById('score-display');
        const audio = document.getElementById('bg-music');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a25);
            scene.fog = new THREE.Fog(0x1a1a25, 20, 180);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            const hemiLight = new THREE.HemisphereLight( 0xaaaaff, 0x000000, 0.85 ); 
            scene.add( hemiLight );
            const dirLight = new THREE.DirectionalLight( 0xffffff, 0.4 );
            dirLight.position.set( 50, 200, 100 );
            scene.add( dirLight );

            // ZEMİN
            const floorGeo = new THREE.PlaneGeometry(1200, 1200, 150, 150);
            floorGeo.rotateX(-Math.PI / 2);
            const pos = floorGeo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i), z = pos.getZ(i);
                pos.setY(i, (Math.sin(x*0.03)*3) + (Math.cos(z*0.03)*3));
            }
            floorGeo.computeVertexNormals();
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x252a25, roughness: 0.9 });
            scene.add(new THREE.Mesh(floorGeo, floorMat));

            createMonster();

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            controls = new THREE.PointerLockControls(camera, document.body);

            document.getElementById('play-btn').onclick = () => {
                if(audio) { audio.volume = 0.5; audio.play().catch(e=>console.log(e)); }
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('story-screen').classList.remove('hidden');
            };
            document.getElementById('continue-btn').onclick = () => {
                document.getElementById('story-screen').classList.add('hidden');
                startGame();
            };
            document.getElementById('retry-btn').onclick = () => { location.reload(); };

            if(isMob) setupMobile();
            setupKeyboard();
            animate();
        }

        function createMonster() {
            monster = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({color: 0x080808, roughness: 0.5});
            const redGlow = new THREE.MeshBasicMaterial({color: 0xff0000});

            monsterBody = new THREE.Group();
            monster.add(monsterBody);

            const chest = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 2.0), skinMat);
            monsterBody.add(chest);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), skinMat);
            head.position.set(0, 0.8, -1.2); monsterBody.add(head);

            const eyeGeom = new THREE.SphereGeometry(0.12);
            const eye1 = new THREE.Mesh(eyeGeom, redGlow); eye1.position.set(-0.3, 0.2, -0.6); head.add(eye1);
            const eye2 = new THREE.Mesh(eyeGeom, redGlow); eye2.position.set(0.3, 0.2, -0.6); head.add(eye2);

            for(let i=0; i<4; i++) {
                const isLeft = i%2!==0, isFront = i<2;
                const shoulder = new THREE.Group();
                shoulder.position.set(isLeft?-0.8:0.8, 0, isFront?-0.5:0.8);
                monsterBody.add(shoulder);

                const uLeg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.2), skinMat); uLeg.position.y = -0.75;
                const uPiv = new THREE.Group(); uPiv.add(uLeg); uPiv.rotation.z = isLeft?0.5:-0.5; shoulder.add(uPiv);

                const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.0, 0.15), skinMat); lLeg.position.y = -1.0;
                const lPiv = new THREE.Group(); lPiv.position.y = -1.5; lPiv.add(lLeg); lPiv.rotation.x = isFront?-0.3:0.3; uPiv.add(lPiv);

                limbJoints.push({shoulder: shoulder, upper: uPiv, lower: lPiv, index: i});
            }
            monster.position.set(0, -500, 0);
            scene.add(monster);
        }

        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 20; canJump = false; }
            });
            document.addEventListener('keyup', (e) => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
        }

        function setupMobile() {
            document.getElementById('mobile-controls').style.display = 'block';
            const joy = document.getElementById('joystick-area'), st = document.getElementById('stick');
            joy.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = joy.getBoundingClientRect();
                const dx = e.touches[0].clientX - (rect.left + 60), dy = e.touches[0].clientY - (rect.top + 60);
                const d = Math.min(Math.sqrt(dx*dx + dy*dy), 50), a = Math.atan2(dy, dx);
                st.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                touchM = { x: dx/50, y: dy/50 };
            }, {passive:false});
            joy.addEventListener('touchend', () => { st.style.transform = 'translate(0,0)'; touchM = { x: 0, y: 0 }; });
            let lX;
            document.getElementById('look-area').addEventListener('touchstart', e => lX = e.touches[0].clientX);
            document.getElementById('look-area').addEventListener('touchmove', e => {
                camera.rotation.y -= (e.touches[0].clientX - lX) * 0.006; lX = e.touches[0].clientX;
            }, {passive:false});
            document.getElementById('jump-btn').addEventListener('touchstart', (e) => { e.preventDefault(); if(canJump){velocity.y+=20; canJump=false;} });
        }

        function startGame() {
            isGame = true; gameTime = 0; speedMultiplier = 1.0; scoreEl.style.display = 'block';
            camera.position.set(0, 10, 0); camera.rotation.set(0, 0, 0);
            monster.position.set(0, 8, -150); // UZAKTA BAŞLA
            velocity.set(0,0,0);
            if(!isMob) controls.lock();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isGame) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;
                
                // SKOR SİSTEMİ (ZAMAN)
                gameTime += delta;
                scoreEl.innerText = 'SÜRE: ' + Math.floor(gameTime) + ' sn';
                
                // HIZLANMA MANTIĞI (ÇOK DAHA YAVAŞ)
                // Her 60 saniyede bir hız %10 artar. Işık hızı yok.
                // Maksimum hız 2.0x ile sınırlandı.
                speedMultiplier = Math.min(2.0, 1 + (gameTime / 600)); 

                // OYUNCU HAREKETİ
                velocity.x -= velocity.x * 10 * delta; velocity.z -= velocity.z * 10 * delta; velocity.y -= 9.8 * 6.0 * delta;
                const baseSpeed = 150 * speedMultiplier; // Oyuncu hızı
                
                if(moveF || touchM.y < -0.2) velocity.z -= baseSpeed * delta;
                if(moveB || touchM.y > 0.2) velocity.z += baseSpeed * delta;
                if(moveL || touchM.x < -0.2) velocity.x -= baseSpeed * delta;
                if(moveR || touchM.x > 0.2) velocity.x += baseSpeed * delta;
                
                controls.moveRight(velocity.x * delta); controls.moveForward(-velocity.z * delta); camera.position.y += velocity.y * delta;
                const gH = (Math.sin(camera.position.x*0.03)*3) + (Math.cos(camera.position.z*0.03)*3);
                if(camera.position.y < gH + 4) { velocity.y = 0; camera.position.y = gH + 4; canJump = true; }

                // CANAVAR HAREKETİ (DÜZELTİLDİ)
                monster.lookAt(camera.position.x, monster.position.y, camera.position.z);
                const dir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                
                // Canavar, oyuncudan her zaman %10 daha yavaş başlar (0.90)
                // Hız çarpanı arttıkça canavar oyuncuyla eşitlenir ama asla ışık hızına çıkmaz.
                let monsterSpeed = baseSpeed * 0.20; 
                
                monster.position.add(dir.multiplyScalar(monsterSpeed * delta));
                monster.position.y = (Math.sin(monster.position.x*0.03)*3) + (Math.cos(monster.position.z*0.03)*3) + 3.5;

                // Animasyon
                monsterBody.position.y = Math.sin(time * 0.015) * 0.2;
                limbJoints.forEach(l => {
                    const off = l.index%2===0?0:Math.PI;
                    l.shoulder.rotation.x = Math.sin(time*0.01*speedMultiplier + off) * 0.6;
                    l.lower.rotation.x = Math.abs(Math.cos(time*0.01*speedMultiplier + off)) * -0.8;
                });

                if(monster.position.distanceTo(camera.position) < 3.5) {
                    isGame = false;
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    document.getElementById('final-score').innerText = "Hayatta Kaldın: " + Math.floor(gameTime) + " sn";
                    scoreEl.style.display = 'none';
                    controls.unlock();
                }
                prevTime = time;
            } else { prevTime = performance.now(); }
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
