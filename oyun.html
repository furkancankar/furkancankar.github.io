<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape to IBO - Survival</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background-color: #000; user-select: none; -webkit-user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: none; }
        .screen { background: rgba(10, 10, 10, 0.98); color: #ddd; padding: 30px; border-radius: 5px; text-align: center; pointer-events: auto; border: 1px solid #500; max-width: 600px; width: 85%; box-shadow: 0 0 50px #100; }
        h1 { font-size: 3em; margin-bottom: 10px; color: #a00; text-shadow: 0 0 15px #f00; letter-spacing: 5px; }
        button { background: #700; color: #fff; border: none; padding: 15px 50px; font-size: 1.2em; cursor: pointer; font-family: inherit; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #f00; box-shadow: 0 0 20px #f00; }
        .hidden { display: none !important; }
        #score-display { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 1.5em; font-weight: bold; z-index: 90; text-shadow: 1px 1px 2px black; display: none; }
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 50; }
        #joystick-area { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; pointer-events: auto; border: 1px solid rgba(200, 0, 0, 0.3); }
        #stick { width: 50px; height: 50px; background: rgba(200, 0, 0, 0.5); border-radius: 50%; position: absolute; top: 40px; left: 40px; }
        #jump-btn { position: absolute; bottom: 50px; right: 40px; width: 90px; height: 90px; background: rgba(200, 0, 0, 0.2); border: 1px solid rgba(200, 0, 0, 0.4); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; color: #ccc; }
        #look-area { position: absolute; top: 0; right: 0; width: 60%; height: 100%; pointer-events: auto; }
        #portrait-warning { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #f00; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        @media screen and (orientation: landscape) { #portrait-warning { display: none; } }
    </style>
</head>
<body>
    <div id="portrait-warning"><h1>LUTFEN TELEFONU CEVIRIN</h1><p>Yatay modda oynamalisiniz.</p></div>
    <div id="score-display">SKOR: 0</div>
    <div id="ui-layer">
        <div id="main-menu" class="screen"><h1>ESCAPE TO IBO</h1><button id="play-btn">OYNA</button></div>
        <div id="story-screen" class="screen hidden">
            <h2 style="color: #800;">HIKAYE</h2>
            <div style="text-align: left; color: #aaa;">
                Sis biraz aralandi ama tehlike buyuyor. Hayatta kaldikca o sey daha da hizlanacak. Sen de oyle...
            </div>
            <button id="continue-btn">DEVAM ET</button>
        </div>
        <div id="game-over-screen" class="screen hidden"><h1 style="color: #f00;">YAKALANDIN</h1><p id="final-score"></p><button id="retry-btn">TEKRAR DENE</button></div>
    </div>
    <div id="mobile-controls">
        <div id="joystick-area"><div id="stick"></div></div>
        <div id="look-area"></div>
        <div id="jump-btn">ZIPLA</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script>
        let scene, camera, renderer, controls, monster, monsterParts = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now(), isGame = false;
        let touchM = { x: 0, y: 0 }, isMob = /Android|iPhone|iPad/i.test(navigator.userAgent);
        
        // SKOR VE HIZ DEGISKENLERI
        let score = 0;
        const BASE_PLAYER_SPEED = 120; // Baz oyuncu hizi
        const BASE_MONSTER_SPEED = 12;  // Baz canavar hizi
        let speedMultiplier = 1.0;      // Hiz duzenleyici carpan
        const scoreLabel = document.getElementById('score-display');

        function init() {
            scene = new THREE.Scene();
            // AYDINLATMA DUZENLEMESI (Daha aydinlik sis ve arka plan)
            scene.background = new THREE.Color(0x111111); // Zifiri karanliktan hafif griye
            scene.fog = new THREE.Fog(0x111111, 5, 80); // Sis baslangic ve bitis mesafesi arttirildi

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // ISIKLAR (Daha guclu ortam isigi + Ay isigi)
            const amb = new THREE.AmbientLight(0x606060, 0.6); scene.add(amb); // Ortam isigi arttirildi
            const moon = new THREE.DirectionalLight(0xaaaaff, 0.4); // Hafif mavi ay isigi eklendi
            moon.position.set(50, 100, 50); scene.add(moon);

            // El feneri (Hala var ama artik tek isik kaynagi degil)
            const flashlight = new THREE.SpotLight(0xffffff, 0.8, 60, Math.PI/5, 0.3);
            camera.add(flashlight); camera.add(flashlight.target); flashlight.target.position.set(0,0,-1); scene.add(camera);

            // ZEMIN
            const floorGeo = new THREE.PlaneGeometry(600, 600, 100, 100); floorGeo.rotateX(-Math.PI / 2);
            const pos = floorGeo.attributes.position;
            for(let i=0; i<pos.count; i++) pos.setY(i, (Math.sin(pos.getX(i)*0.04)*6) + (Math.cos(pos.getZ(i)*0.04)*6));
            floorGeo.computeVertexNormals();
            scene.add(new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({color: 0x152015, roughness: 0.8})));

            // CANAVAR
            monster = new THREE.Group();
            const mMat = new THREE.MeshStandardMaterial({color: 0x050505, roughness: 1});
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 3.5), mMat); monster.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.6), mMat); head.position.set(0, 0.5, 2); monster.add(head);
            for(let i=0; i<4; i++) {
                let limb = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 4.5), mMat);
                limb.position.set(i<2?-0.9:0.9, -1, i%2==0?1.2:-1.2); monsterParts.push(limb); monster.add(limb);
            }
            monster.position.y = -50; scene.add(monster);

            renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
            controls = new THREE.PointerLockControls(camera, document.body);

            // UI GECISLERI VE BASLATMA
            document.getElementById('play-btn').onclick = () => { document.getElementById('main-menu').classList.add('hidden'); document.getElementById('story-screen').classList.remove('hidden'); };
            document.getElementById('continue-btn').onclick = () => { 
                document.getElementById('story-screen').classList.add('hidden'); 
                // Oyunu Baslat/Sifirla
                isGame = true; score = 0; speedMultiplier = 1.0; scoreLabel.style.display = 'block';
                camera.position.set(0,10,0); monster.position.set(0,10,-60);
                if(!isMob) controls.lock(); 
            };
            document.getElementById('retry-btn').onclick = () => { location.reload(); };

            if(isMob) setupMobileControls();
            document.onkeydown = (e) => { if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true; if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true; if(e.code=='Space' && canJump) {velocity.y+=20; canJump=false;} };
            document.onkeyup = (e) => { if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false; if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false; };
            animate();
        }

        function setupMobileControls() {
            document.getElementById('mobile-controls').style.display = 'block';
            const joy = document.getElementById('joystick-area'), st = document.getElementById('stick');
            joy.ontouchmove = (e) => {
                let rect = joy.getBoundingClientRect(), dx = e.touches[0].clientX - (rect.left + 65), dy = e.touches[0].clientY - (rect.top + 65);
                let d = Math.min(Math.sqrt(dx*dx+dy*dy), 40), a = Math.atan2(dy, dx);
                st.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
                touchM = { x: dx/40, y: dy/40 };
            };
            joy.ontouchend = () => { st.style.transform = 'translate(0,0)'; touchM = {x:0, y:0}; };
            let lastLX; document.getElementById('look-area').ontouchstart = (e) => { lastLX = e.touches[0].clientX; };
            document.getElementById('look-area').ontouchmove = (e) => { camera.rotation.y -= (e.touches[0].clientX - lastLX) * 0.007; lastLX = e.touches[0].clientX; };
            document.getElementById('jump-btn').ontouchstart = () => { if(canJump) velocity.y += 20; canJump = false; };
        }

        function animate() {
            requestAnimationFrame(animate);
            if(isGame) {
                let time = performance.now(), delta = (time - prevTime)/1000;
                
                // SKOR VE HIZ HESAPLAMA
                score += delta * 10; // Her saniye yaklasik 10 puan
                scoreLabel.innerText = 'SKOR: ' + Math.floor(score);
                // Her 500 puanda hiz %10 artar (Ornek: 1 + 500/5000 = 1.1x hiz)
                speedMultiplier = 1 + (score / 5000);

                // OYUNCU HAREKETI (Dinamik Hiz ile)
                let currentPlayerSpeed = BASE_PLAYER_SPEED * speedMultiplier;
                velocity.x -= velocity.x * 10 * delta; velocity.z -= velocity.z * 10 * delta; velocity.y -= 9.8 * 6 * delta;
                if(moveF || touchM.y < -0.2) velocity.z -= currentPlayerSpeed * delta; if(moveB || touchM.y > 0.2) velocity.z += currentPlayerSpeed * delta;
                if(moveL || touchM.x < -0.2) velocity.x -= currentPlayerSpeed * delta; if(moveR || touchM.x > 0.2) velocity.x += currentPlayerSpeed * delta;
                controls.moveRight(velocity.x * delta); controls.moveForward(-velocity.z * delta); camera.position.y += velocity.y * delta;
                
                // Zemin kontrolu
                let groundH = (Math.sin(camera.position.x*0.04)*6) + (Math.cos(camera.position.z*0.04)*6);
                if(camera.position.y < groundH + 4) { velocity.y = 0; camera.position.y = groundH + 4; canJump = true; }

                // CANAVAR HAREKETI (Dinamik Hiz ile)
                monster.lookAt(camera.position.x, monster.position.y, camera.position.z);
                let mDir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                let currentMonsterSpeed = BASE_MONSTER_SPEED * speedMultiplier;
                monster.position.add(mDir.multiplyScalar(currentMonsterSpeed * delta));
                monster.position.y = (Math.sin(monster.position.x*0.04)*6) + (Math.cos(monster.position.z*0.04)*6) + 2.5;
                monsterParts.forEach((l, i) => l.rotation.x = Math.sin(time*0.01*speedMultiplier + i) * 0.6); // Animasyon da hizlansin

                // OYUN BITISI
                if(monster.position.distanceTo(camera.position) < 3.5) { 
                    isGame = false; 
                    document.getElementById('game-over-screen').classList.remove('hidden'); 
                    document.getElementById('final-score').innerText = 'Son Skor: ' + Math.floor(score);
                    scoreLabel.style.display = 'none';
                    controls.unlock(); 
                }
                prevTime = time;
            } else { prevTime = performance.now(); }
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
