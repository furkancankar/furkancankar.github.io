<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yabuz ibodan kacıuo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        
        /* Mobil Kontroller */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            z-index: 100;
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            user-select: none;
        }
        #btn-run {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.3);
            border: 3px solid red;
            border-radius: 50%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        #gameover {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 30px;
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 3px solid red;
            z-index: 200;
            width: 80%;
        }
        button.retry { font-size: 20px; padding: 10px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="controls">
        <div></div><div class="btn" id="up">↑</div><div></div>
        <div class="btn" id="left">←</div><div></div><div class="btn" id="right">→</div>
        <div></div><div class="btn" id="down">↓</div><div></div>
    </div>
    <div id="btn-run">KOŞ</div>

    <div id="gameover">
        SİKİLDİN!<br>
        <button class="retry" onclick="location.reload()">TEKRAR DENE</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player, enemy;
        let obstacles = [];
        let keys = { w: false, a: false, s: false, d: false, shift: false };
        let playerSpeed = 0.4;
        let enemySpeed = 0.32;
        let isGameOver = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0a0a);
            scene.fog = new THREE.Fog(0x1a0a0a, 5, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Oyuncu (Anime Kızı Temsili)
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x3344ff }));
            body.position.y = 0.6;
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
            head.position.y = 1.35;
            player.add(body, head);
            scene.add(player);

            // Yaratık (Siyah Canavar) - 40 birim uzağa spawnlanıyor
            enemy = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3, 0.8), new THREE.MeshStandardMaterial({ color: 0x000000 }));
            enemy.position.set(0, 1.5, -40); 
            scene.add(enemy);

            // Harita Oluşturma
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x221111 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const brickMat = new THREE.MeshStandardMaterial({ color: 0x662222 });
            for (let i = 0; i < 150; i++) {
                const p = new THREE.Mesh(new THREE.BoxGeometry(1.5, 6, 1.5), brickMat);
                p.position.set(Math.random() * 100 - 50, 3, Math.random() * 100 - 50);
                if (p.position.distanceTo(player.position) > 5) {
                    scene.add(p);
                    obstacles.push(p);
                }
            }

            // --- KONTROL ETKİLEŞİMLERİ ---
            // Klavye
            window.onkeydown = (e) => {
                if(e.key=='w'||e.key=='ArrowUp') keys.w=true;
                if(e.key=='s'||e.key=='ArrowDown') keys.s=true;
                if(e.key=='a'||e.key=='ArrowLeft') keys.a=true;
                if(e.key=='d'||e.key=='ArrowRight') keys.d=true;
                if(e.shiftKey) keys.shift=true;
            };
            window.onkeyup = (e) => {
                if(e.key=='w'||e.key=='ArrowUp') keys.w=false;
                if(e.key=='s'||e.key=='ArrowDown') keys.s=false;
                if(e.key=='a'||e.key=='ArrowLeft') keys.a=false;
                if(e.key=='d'||e.key=='ArrowRight') keys.d=false;
                if(!e.shiftKey) keys.shift=false;
            };

            // Mobil Dokunmatik (Touch)
            const setupTouch = (id, key) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); keys[key] = true; };
                el.ontouchend = (e) => { e.preventDefault(); keys[key] = false; };
            };
            setupTouch('up', 'w'); setupTouch('down', 's');
            setupTouch('left', 'a'); setupTouch('right', 'd');
            setupTouch('btn-run', 'shift');

            animate();
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            let moveSpeed = keys.shift ? playerSpeed * 1.8 : playerSpeed;
            let oldPos = player.position.clone();

            if (keys.w) player.position.z -= moveSpeed;
            if (keys.s) player.position.z += moveSpeed;
            if (keys.a) player.position.x -= moveSpeed;
            if (keys.d) player.position.x += moveSpeed;

            // Çarpışma ve Sınır Kontrolü
            obstacles.forEach(obs => {
                if (player.position.distanceTo(obs.position) < 1.5) player.position.copy(oldPos);
            });

            // Kamera Takibi
            camera.position.set(player.position.x, player.position.y + 4, player.position.z + 7);
            camera.lookAt(player.position);

            // Düşman Takibi
            let dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
            enemy.position.add(dir.multiplyScalar(enemySpeed));
            enemy.lookAt(player.position);

            if (player.position.distanceTo(enemy.position) < 1.2) {
                isGameOver = true;
                document.getElementById('gameover').style.display = 'block';
            }

            renderer.render(scene, camera);
        }

        init();
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
