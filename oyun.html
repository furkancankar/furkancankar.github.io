<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escape to IBO - Final Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background-color: #050505; user-select: none; -webkit-user-select: none; }
        
        /* UI ELEMENTLERİ */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; z-index: 100; pointer-events: none; }
        
        .screen { 
            background: rgba(15, 20, 25, 0.95); 
            color: #ddd; 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center; 
            pointer-events: auto; 
            border: 2px solid #555; 
            max-width: 700px; 
            width: 90%; 
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center;
        }

        h1 { font-size: 3em; margin: 10px 0; color: #d00; text-shadow: 0 0 10px #500; letter-spacing: 5px; }
        
        /* BUTONLAR */
        button { 
            background: #222; color: #fff; border: 1px solid #666; padding: 12px 40px; 
            font-size: 1.1em; cursor: pointer; font-family: inherit; font-weight: bold; 
            margin-top: 15px; transition: 0.2s; width: 80%; max-width: 300px; text-transform: uppercase;
        }
        button:hover { background: #d00; border-color: #f00; box-shadow: 0 0 15px #d00; }
        
        /* Link Butonu (Özel Stil) */
        .link-btn { background: #004488; border-color: #0066cc; }
        .link-btn:hover { background: #0066cc; box-shadow: 0 0 15px #0066cc; }

        .hidden { display: none !important; }

        /* HİKAYE GÖRSELİ */
        #story-image {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16/9;
            background-color: #000;
            border: 2px solid #333;
            margin-bottom: 20px;
            object-fit: cover;
            display: block;
        }

        /* SKOR */
        #score-display { 
            position: absolute; top: 20px; left: 20px; 
            color: #fff; font-size: 1.5em; font-weight: bold; 
            z-index: 90; text-shadow: 2px 2px 4px black; 
            display: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }

        /* MOBİL KONTROLLER */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 50; }
        #joystick-area { position: absolute; bottom: 40px; left: 40px; width: 140px; height: 140px; background: rgba(255, 255, 255, 0.05); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255, 255, 255, 0.1); }
        #stick { width: 60px; height: 60px; background: rgba(200, 50, 50, 0.5); border-radius: 50%; position: absolute; top: 40px; left: 40px; box-shadow: 0 0 15px #f00; }
        #jump-btn { position: absolute; bottom: 60px; right: 40px; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 1.2em; }
        #jump-btn:active { background: rgba(200, 50, 50, 0.5); }
        #look-area { position: absolute; top: 0; right: 0; width: 60%; height: 100%; pointer-events: auto; }

        /* UYARI */
        #portrait-warning { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #f44; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        @media screen and (orientation: landscape) { #portrait-warning { display: none; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="MUZIK_LINKINI_BURAYA_YAPISTIR.mp3" type="audio/mpeg">
    </audio>

    <div id="portrait-warning"><h1>LUTFEN TELEFONU CEVIRIN</h1><p>Yatay modda oynamalisiniz.</p></div>
    <div id="score-display">SKOR: 0</div>
    
    <div id="ui-layer">
        <div id="main-menu" class="screen">
            <h1>ESCAPE TO IBO</h1>
            <button id="play-btn">OYNA</button>
            
            <button class="link-btn" onclick="window.location.href='https://www.google.com'">BAĞLANTIYA GİT</button>
        </div>

        <div id="story-screen" class="screen hidden">
            <img id="story-image" src="FOTOGRAF_LINKINI_BURAYA_YAPISTIR.jpg" alt="Hikaye Gorseli">
            <button id="continue-btn">BAŞLA</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #f00;">ÖLDÜN</h1>
            <h3 id="final-score" style="color:white;"></h3>
            <button id="retry-btn">TEKRAR DENE</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="joystick-area"><div id="stick"></div></div>
        <div id="look-area"></div>
        <div id="jump-btn">ZIPLA</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- DEĞİŞKENLER ---
        let scene, camera, renderer, controls, monster, monsterParts = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now(), isGame = false;
        let touchM = { x: 0, y: 0 }, isMob = /Android|iPhone|iPad/i.test(navigator.userAgent);
        
        let score = 0;
        let speedMultiplier = 1.0;
        const scoreEl = document.getElementById('score-display');
        const audio = document.getElementById('bg-music');

        // --- BAŞLATMA ---
        function init() {
            scene = new THREE.Scene();
            // (KOD: 1) AYDINLATMA GÜNCELLEMESİ - Daha aydınlık sis
            scene.background = new THREE.Color(0x151520); 
            scene.fog = new THREE.FogExp2(0x101015, 0.012); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 1. Ortam Işığı (Artırıldı)
            const ambient = new THREE.AmbientLight(0x555560, 0.7); 
            scene.add(ambient);

            // 2. Ay Işığı
            const moonLight = new THREE.DirectionalLight(0xaaccff, 0.5);
            moonLight.position.set(50, 100, 50);
            scene.add(moonLight);

            // 3. EL FENERİ (KOD: 1 - Düzeltildi)
            const flashLight = new THREE.SpotLight(0xffffff, 2.5); // Şiddet artırıldı
            flashLight.angle = Math.PI / 4;
            flashLight.penumbra = 0.3;
            flashLight.decay = 1;
            flashLight.distance = 100;
            
            // Feneri ve hedefini kameraya ekliyoruz ki kamera ile dönsün
            camera.add(flashLight);
            camera.add(flashLight.target);
            flashLight.target.position.set(0, 0, -1); // Işık hep ileri baksın
            scene.add(camera);

            // --- ZEMİN ---
            const floorGeo = new THREE.PlaneGeometry(1000, 1000, 200, 200);
            floorGeo.rotateX(-Math.PI / 2);
            const pos = floorGeo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i);
                let z = pos.getZ(i);
                // Araziyi biraz daha düzleştirdik, koşmak kolay olsun
                let y = (Math.sin(x*0.04)*4) + (Math.cos(z*0.04)*4) + (Math.sin(x*0.1 + z*0.1)*1.5);
                pos.setY(i, y);
            }
            floorGeo.computeVertexNormals();
            
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x222a22, 
                roughness: 0.8,
                metalness: 0.2
            });
            scene.add(new THREE.Mesh(floorGeo, floorMat));

            // --- CANAVAR ---
            createAdvancedMonster();

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.physicallyCorrectLights = true; 
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);

            // --- ETKİLEŞİMLER ---
            document.getElementById('play-btn').onclick = () => {
                // Müzik başlatmayı dene
                if(audio) { audio.volume = 0.6; audio.play().catch(e => console.log("Audio play error:", e)); }
                
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('story-screen').classList.remove('hidden');
            };

            document.getElementById('continue-btn').onclick = () => {
                document.getElementById('story-screen').classList.add('hidden');
                startGame();
            };
            
            document.getElementById('retry-btn').onclick = () => { location.reload(); };

            if(isMob) setupMobile();
            setupKeyboard();
            
            animate();
        }

        // --- GELİŞMİŞ CANAVAR MODELİ (KOD: 5) ---
        function createAdvancedMonster() {
            monster = new THREE.Group();
            const blackMat = new THREE.MeshStandardMaterial({color: 0x050505, roughness: 0.7});
            const glowMat = new THREE.MeshBasicMaterial({color: 0xff0000}); // Kırmızı gözler

            // 1. Gövde (Daha organik durması için 2 parça)
            const chest = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.5), blackMat);
            const abdomen = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1.5), blackMat);
            abdomen.position.z = 1.4;
            monster.add(chest);
            monster.add(abdomen);

            // 2. Kafa (Korkunç olması için hafif öne eğik)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 16, 16), blackMat);
            head.position.set(0, 0.5, -1);
            monster.add(head);

            // Gözler (Parlayan)
            const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.1), glowMat);
            eye1.position.set(-0.25, 0.1, -0.6);
            head.add(eye1);
            
            const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.1), glowMat);
            eye2.position.set(0.25, 0.1, -0.6);
            head.add(eye2);

            // 3. Uzuvlar (Daha ince ve eklemli gibi görünen parçalar)
            // 4 Bacak
            for(let i=0; i<4; i++) {
                const legGroup = new THREE.Group();
                // Üst bacak
                const upperLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 2.5), blackMat);
                upperLeg.position.y = -1;
                upperLeg.rotation.z = i%2==0 ? 0.3 : -0.3; // Dışa aç
                
                // Alt bacak (sivri)
                const lowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.02, 3), blackMat);
                lowerLeg.position.y = -3.5;
                
                legGroup.add(upperLeg);
                legGroup.add(lowerLeg);

                // Konumlandırma
                legGroup.position.set(i<2?-0.8:0.8, 0, i%2==0?0.5:1.8);
                
                monsterParts.push(legGroup);
                monster.add(legGroup);
            }
            
            monster.position.set(0, -100, 0); // Başlangıçta yerin altında sakla
            scene.add(monster);
        }

        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 20; canJump = false; }
            });
            document.addEventListener('keyup', (e) => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
        }

        function setupMobile() {
            document.getElementById('mobile-controls').style.display = 'block';
            const joy = document.getElementById('joystick-area'), st = document.getElementById('stick');
            
            joy.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = joy.getBoundingClientRect();
                const dx = e.touches[0].clientX - (rect.left + 70);
                const dy = e.touches[0].clientY - (rect.top + 70);
                const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                const angle = Math.atan2(dy, dx);
                st.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                touchM = { x: dx/50, y: dy/50 };
            }, {passive:false});

            joy.addEventListener('touchend', () => { st.style.transform = 'translate(0,0)'; touchM = { x: 0, y: 0 }; });

            let lastX;
            document.getElementById('look-area').addEventListener('touchstart', e => lastX = e.touches[0].clientX);
            document.getElementById('look-area').addEventListener('touchmove', e => {
                const delta = e.touches[0].clientX - lastX;
                camera.rotation.y -= delta * 0.006;
                lastX = e.touches[0].clientX;
            }, {passive:false});

            document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
                e.preventDefault(); if(canJump) { velocity.y += 20; canJump = false; }
            });
        }

        function startGame() {
            isGame = true;
            score = 0;
            speedMultiplier = 1.0;
            scoreEl.style.display = 'block';
            
            camera.position.set(0, 10, 0);
            camera.rotation.set(0, 0, 0);
            
            // CANAVAR KONUMU (KOD: 5 - Uzağa koyma)
            monster.position.set(0, 10, -120); // Oyuncudan 120 birim uzakta başlar
            
            velocity.set(0,0,0);
            if(!isMob) controls.lock();
        }

        function animate() {
            requestAnimationFrame(animate);

            if(isGame) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;
                
                // --- MANTIK ---
                score += delta * 20;
                speedMultiplier = 1 + (score / 4000); // Yavaşça hızlan
                scoreEl.innerText = 'SKOR: ' + Math.floor(score);

                // --- OYUNCU HAREKETİ ---
                velocity.x -= velocity.x * 10 * delta;
                velocity.z -= velocity.z * 10 * delta;
                velocity.y -= 9.8 * 6.0 * delta; // Yerçekimi

                const baseSpeed = 140 * speedMultiplier;
                
                if(moveF || touchM.y < -0.2) velocity.z -= baseSpeed * delta;
                if(moveB || touchM.y > 0.2) velocity.z += baseSpeed * delta;
                if(moveL || touchM.x < -0.2) velocity.x -= baseSpeed * delta;
                if(moveR || touchM.x > 0.2) velocity.x += baseSpeed * delta;

                controls.moveRight(velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // Zemin Çarpışması
                const groundH = (Math.sin(camera.position.x*0.04)*4) + (Math.cos(camera.position.z*0.04)*4) + (Math.sin(camera.position.x*0.1 + camera.position.z*0.1)*1.5);
                if(camera.position.y < groundH + 4) {
                    velocity.y = 0;
                    camera.position.y = groundH + 4;
                    canJump = true;
                }

                // --- CANAVAR AI ---
                monster.lookAt(camera.position.x, monster.position.y, camera.position.z);
                const dir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
                
                // Hız Dengesi: Başta yavaş, sonra hızlanır ama seni yakalaması için hata yapman gerekir
                let monsterSpeed = baseSpeed * (0.8 + (speedMultiplier * 0.1)); 
                if(monsterSpeed > baseSpeed * 1.1) monsterSpeed = baseSpeed * 1.1; // Çok aşırı hızlanmasın

                monster.position.add(dir.multiplyScalar(monsterSpeed * delta));
                
                // Canavarın Zemin Uyumu
                const mGround = (Math.sin(monster.position.x*0.04)*4) + (Math.cos(monster.position.z*0.04)*4) + (Math.sin(monster.position.x*0.1 + monster.position.z*0.1)*1.5);
                monster.position.y = mGround + 3;

                // Canavar Animasyonu (Korkutucu titreme ve yürüme)
                monsterParts.forEach((leg, i) => {
                    const speed = time * 0.015 * speedMultiplier;
                    leg.rotation.x = Math.sin(speed + (i*1.5)) * 0.8; // Bacakları salla
                    leg.position.y = Math.sin(speed * 2 + i) * 0.5; // Yukarı aşağı titret
                });

                // --- OYUN BİTİŞİ ---
                if(camera.position.distanceTo(monster.position) < 4) {
                    isGame = false;
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    document.getElementById('final-score').innerText = "Son Skor: " + Math.floor(score);
                    scoreEl.style.display = 'none';
                    controls.unlock();
                }

                prevTime = time;
            } else {
                prevTime = performance.now();
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
