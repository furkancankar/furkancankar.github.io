<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Escape to IBO</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background-color: #000; user-select: none; }
        
        /* UI ELEMENTLERİ */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: center; align-items: center; z-index: 10; }
        
        .screen { 
            background: rgba(0, 0, 0, 0.85); 
            color: white; 
            padding: 40px; 
            border-radius: 10px; 
            text-align: center; 
            pointer-events: auto; 
            border: 2px solid #555;
            max-width: 600px;
            width: 80%;
        }

        h1 { font-size: 3em; margin-bottom: 20px; color: #ff4444; text-shadow: 2px 2px 0 #000; }
        p { font-size: 1.2em; line-height: 1.6; margin-bottom: 30px; }
        
        button {
            background: #ff4444; color: white; border: none; padding: 15px 40px; 
            font-size: 1.5em; cursor: pointer; font-family: inherit; border-radius: 5px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        /* MOBİL KONTROLLER */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%; height: 150px;
            display: none; /* JS ile mobilde ise açılacak */
            pointer-events: none;
            z-index: 5;
        }

        .control-zone {
            position: absolute; bottom: 20px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border-radius: 50%;
            pointer-events: auto; border: 2px solid rgba(255, 255, 255, 0.4);
        }
        #stick-zone { left: 30px; }
        #stick { 
            width: 50px; height: 50px; background: rgba(255, 255, 255, 0.6); 
            border-radius: 50%; position: absolute; top: 35px; left: 35px; 
        }
        #jump-btn { right: 30px; background: rgba(255, 68, 68, 0.4); display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; }
        #jump-btn:active { background: rgba(255, 68, 68, 0.8); }

        /* Gizleme sınıfları */
        .hidden { display: none !important; }

        /* Story Text alanı */
        #story-text-content { text-align: left; color: #ddd; font-size: 1.1rem; white-space: pre-line; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="main-menu" class="screen">
            <h1>Escape to IBO</h1>
            <button id="play-btn">OYNA</button>
        </div>

        <div id="story-screen" class="screen hidden">
            <h2>HİKAYE</h2>
            <div id="story-text-content">
                Buraya oyunun hikayesini yazacaksın. 
                Örneğin: "IBO'nun lanetli tepelerinde kayboldun..."
                (HTML kodunu açıp bu kısmı düzenleyebilirsin.)
            </div>
            <br>
            <button id="continue-btn">DEVAM ET</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: red;">YAKALANDIN!</h1>
            <p>O karanlık varlık seni ele geçirdi.</p>
            <button id="retry-btn">TEKRAR DENEYİN</button>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="stick-zone"><div id="stick"></div></div>
        <div id="jump-zone" class="control-zone" style="border:none; background:transparent;"></div>
        <div id="jump-btn" class="control-zone">ZIPLA</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- DEĞİŞKENLER ---
        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let raycaster;
        let terrainMesh;
        
        // Oyun Durumu
        let isGameActive = false;
        let isCaught = false;

        // Düşman (Örümcek)
        let spider;
        let spiderSpeed = 8.5; // Düşman hızı
        let spiderLegs = [];
        let spiderAnimOffset = 0;

        // Mobil Kontroller
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let touchMove = { x: 0, y: 0 }; // Joystick input

        // --- BAŞLANGIÇ FONKSİYONLARI ---

        function init() {
            // Sahne ve Kamera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Gökyüzü mavisi
            scene.fog = new THREE.Fog(0x87CEEB, 10, 150); // Sis efekti (sonsuzluk hissi için)

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 10;

            // Işıklandırma
            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            light.position.set(0, 20, 0);
            scene.add(light);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Arazi Oluşturma (Tepeler)
            createTerrain();

            // Evleri Oluşturma
            createHouses();

            // Örümcek Oluşturma
            createSpider();

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Kontroller (Masaüstü için PointerLock)
            controls = new THREE.PointerLockControls(camera, document.body);

            // Event Listener'lar
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            // UI Butonları
            document.getElementById('play-btn').addEventListener('click', () => {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('story-screen').classList.remove('hidden');
            });

            document.getElementById('continue-btn').addEventListener('click', startGame);
            document.getElementById('retry-btn').addEventListener('click', resetGame);

            // Mobil Kontrol Kurulumu
            if(isMobile) {
                setupMobileControls();
                document.getElementById('mobile-controls').style.display = 'block';
            }
            
            // Animasyon Döngüsü
            animate();
        }

        // --- ARAZİ VE NESNELER ---

        function getHeightAt(x, z) {
            // Basit bir dalga (tepe) fonksiyonu
            return (Math.sin(x * 0.05) * 5) + (Math.cos(z * 0.05) * 5) + (Math.sin(x * 0.02 + z * 0.02) * 10);
        }

        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(400, 400, 100, 100);
            geometry.rotateX(-Math.PI / 2);

            const vertices = geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const z = vertices[i + 2];
                vertices[i + 1] = getHeightAt(x, z); // Yüksekliği ayarla
            }
            geometry.computeVertexNormals();

            const material = new THREE.MeshStandardMaterial({ 
                color: 0x5FA032, // Çimen yeşili
                roughness: 0.8 
            });
            terrainMesh = new THREE.Mesh(geometry, material);
            scene.add(terrainMesh);
        }

        function createHouses() {
            // Rastgele evler yerleştir
            for(let i=0; i<30; i++) {
                let x = (Math.random() - 0.5) * 300;
                let z = (Math.random() - 0.5) * 300;
                let y = getHeightAt(x, z);

                // Evin Gövdesi
                const houseGeo = new THREE.BoxGeometry(6, 6, 6);
                const houseMat = new THREE.MeshStandardMaterial({ color: 0xE8C85A }); // Sarımsı
                const house = new THREE.Mesh(houseGeo, houseMat);
                
                // Çatı
                const roofGeo = new THREE.ConeGeometry(4.5, 3, 4);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333 }); // Gri
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 4.5;
                roof.rotation.y = Math.PI / 4;
                
                house.add(roof);
                house.position.set(x, y + 3, z); // Yere oturt
                scene.add(house);
            }
        }

        function createSpider() {
            spider = new THREE.Group();

            // Gövde
            const bodyGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111 }); // Siyah
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            spider.add(body);

            // Kafa
            const headGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 0.5, 1.2);
            spider.add(head);

            // Gözler (Korkunç Kırmızı)
            const eyeGeo = new THREE.SphereGeometry(0.2);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.3, 0.6, 1.8);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.3, 0.6, 1.8);
            spider.add(leftEye);
            spider.add(rightEye);

            // Bacaklar (4 adet)
            for(let i=0; i<4; i++) {
                const legGeo = new THREE.CylinderGeometry(0.2, 0.1, 4);
                const leg = new THREE.Mesh(legGeo, bodyMat);
                
                leg.rotation.z = (i < 2 ? 1 : -1) * 0.5; // Sol/Sağ eğim
                leg.rotation.x = (i % 2 === 0 ? 0.5 : -0.5); // Ön/Arka
                
                leg.position.y = -1;
                leg.position.x = (i < 2 ? -1 : 1);
                
                spiderLegs.push(leg);
                spider.add(leg);
            }

            spider.position.set(40, 10, 40); // Başlangıç konumu
            scene.add(spider);
        }

        // --- OYUN MANTIĞI ---

        function startGame() {
            document.getElementById('story-screen').classList.add('hidden');
            document.getElementById('ui-layer').style.pointerEvents = 'none'; // Oyuna tıkla
            
            isGameActive = true;
            isCaught = false;

            // Kamera ve Oyuncu Pozisyonu
            camera.position.set(0, 20, 0);
            
            // Örümcek uzağa ışınlansın
            spider.position.set(40, getHeightAt(40,40) + 2, 40);

            if (!isMobile) {
                controls.lock(); // Fareyi kilitle
            }
        }

        function resetGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            startGame();
        }

        function showGameOver() {
            isGameActive = false;
            isCaught = true;
            if(!isMobile) controls.unlock();
            document.getElementById('ui-layer').style.pointerEvents = 'auto';
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // --- KONTROLLER ---

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump === true) velocity.y += 350; canJump = false; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        }

        function setupMobileControls() {
            const stickZone = document.getElementById('stick-zone');
            const stick = document.getElementById('stick');
            const jumpBtn = document.getElementById('jump-btn');
            
            let startX, startY;

            stickZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            stickZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touchX = e.touches[0].clientX;
                const touchY = e.touches[0].clientY;

                let diffX = touchX - startX;
                let diffY = touchY - startY;

                // Sınırlandırma
                const limit = 40;
                const distance = Math.sqrt(diffX*diffX + diffY*diffY);
                if (distance > limit) {
                    const angle = Math.atan2(diffY, diffX);
                    diffX = Math.cos(angle) * limit;
                    diffY = Math.sin(angle) * limit;
                }

                stick.style.transform = `translate(${diffX}px, ${diffY}px)`;

                // Hareketi ayarla (-1 ile 1 arası)
                touchMove.x = diffX / limit;
                touchMove.y = diffY / limit;
            });

            stickZone.addEventListener('touchend', () => {
                stick.style.transform = `translate(0px, 0px)`;
                touchMove.x = 0;
                touchMove.y = 0;
            });

            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (canJump === true) {
                    velocity.y += 350;
                    canJump = false;
                }
            });

            // Ekrana dokunarak kamerayı çevirme (Sağ taraf)
            document.addEventListener('touchmove', (e) => {
                if (e.touches[0].clientX > window.innerWidth / 2) {
                    // Basit kamera dönüşü
                     // Tam bir FPS dönüşü mobilde daha karmaşık olduğu için burada
                     // basitçe karakterin yönüne destek atıyoruz
                     // Gerçek bir FPS touch kontrolü için daha fazla kod gerekir.
                     // Bu örnekte karakter baktığı yöne gider, joystick ile hem dönüp hem yürür.
                     camera.rotation.y -= e.movementX * 0.005 || 0;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANA DÖNGÜ ---

        function animate() {
            requestAnimationFrame(animate);

            if (isGameActive) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // --- OYUNCU HAREKETİ ---
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 100.0 * delta; // Yerçekimi

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                // Masaüstü Hareketi
                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                // Mobil Hareketi
                if (isMobile) {
                    // Joystick Y ileri/geri, X sağ/sol (strafe)
                    // Kameranın baktığı yöne göre vektör hesapla
                    if (touchMove.y !== 0 || touchMove.x !== 0) {
                        const camDir = new THREE.Vector3();
                        camera.getWorldDirection(camDir);
                        camDir.y = 0;
                        camDir.normalize();

                        const camSide = new THREE.Vector3();
                        camSide.crossVectors(camera.up, camDir).normalize(); // Sağ vektör (Cross product sıralaması önemli)

                        // İleri/Geri
                        velocity.z += camDir.z * touchMove.y * 400.0 * delta; // Y joystick
                        velocity.x += camDir.x * touchMove.y * 400.0 * delta;

                        // Sağ/Sol
                        velocity.z += camSide.z * touchMove.x * 400.0 * delta; // X joystick
                        velocity.x += camSide.x * touchMove.x * 400.0 * delta;
                        
                        // Mobilde kamera dönüşü için basit bir "otomatik dönüş" veya ekran sağ tarafı kullanılabilir
                        // Şimdilik joystick sadece yürüme yapıyor.
                        camera.rotation.y -= touchMove.x * 0.02; // Hafifçe dön
                    }
                }

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += (velocity.y * delta); // Y pozisyonunu güncelle

                // Zemin Çarpışması
                let terrainHeight = getHeightAt(camera.position.x, camera.position.z);
                if (camera.position.y < terrainHeight + 10) {
                    velocity.y = 0;
                    camera.position.y = terrainHeight + 10;
                    canJump = true;
                }
                
                // Harita dışına çıkmayı engelle (Sonsuz gibi hissettir ama sınırla)
                if(camera.position.x > 190) camera.position.x = 190;
                if(camera.position.x < -190) camera.position.x = -190;
                if(camera.position.z > 190) camera.position.z = 190;
                if(camera.position.z < -190) camera.position.z = -190;

                // --- ÖRÜMCEK YAPAY ZEKASI ---
                const playerPos = camera.position;
                const spiderPos = spider.position;

                // Örümceği oyuncuya döndür
                spider.lookAt(playerPos.x, playerPos.y, playerPos.z);
                
                // Oyuncuya doğru hareket et
                const dirToPlayer = new THREE.Vector3().subVectors(playerPos, spiderPos).normalize();
                
                // Mesafe
                const dist = playerPos.distanceTo(spiderPos);

                if (dist > 2) { // Çok yaklaşmadıysa kovala
                    spider.position.add(dirToPlayer.multiplyScalar(spiderSpeed * delta));
                    
                    // Örümceğin yerdeki yüksekliği
                    let spiderGroundY = getHeightAt(spider.position.x, spider.position.z);
                    spider.position.y = spiderGroundY + 1.5;
                } else {
                    // Yakaladı!
                    showGameOver();
                }

                // Örümcek Bacak Animasyonu
                spiderAnimOffset += delta * 10;
                spiderLegs.forEach((leg, i) => {
                    leg.rotatio
